<!doctype html>
<html lang="en">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Affordable Property Screener — DAC + 80% AMI Rent Test</title>
    <meta
      name="description"
      content="Check whether a California property sits in a CalEPA Disadvantaged Community and whether its rent roll meets the 80% AMI affordability threshold."
    />

    <!-- Lato — Retrofit.LA's approved web font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@100;300;400;700;900&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind (Play CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              // Retrofit.LA brand palette
              retrofit: {
                blue: "#1D459A",
                green: "#A2E543",

    <!-- React + Babel (in-browser JSX) + PapaParse -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/papaparse@5/papaparse.min.js"></script>

    <style>
      body {
        font-family: "Lato", ui-sans-serif, system-ui, -apple-system, "Segoe UI",
          Roboto, Helvetica, Arial, sans-serif;
      }
    </style>
  </head>
  <body class="bg-white text-retrofit-dark font-sans">
    <div id="root"></div>

    <!--
      App source as JSX. Marked with a non-"text/babel" type so Babel's
      auto-runner ignores it; the runner script at the bottom transforms it
      explicitly with the classic JSX runtime (so no ES-module imports are
      emitted) and evaluates it against the global React/ReactDOM UMDs.
    -->
    <script type="application/jsx" id="appcode">
      const { useState, useEffect, useRef } = React;

      /* ============================================================
       * Constants & types (from src/lib/screener/types.ts)
       * ============================================================ */
      const UNIT_TYPES = [
        "Studio",
        "1 Bedroom",
        "2 Bedroom",
        "3 Bedroom",
        "4 Bedroom",
        "5 Bedroom",
      ];

      const UTILITY_LINE_ITEMS = [
        "heating-gas",
        "heating-electric",
        "cooking-gas",
        "cooking-electric",
        "water-heating-gas",
        "water-heating-electric",
        "basic-electric",
        "water",
      ];

      const UTILITY_LABELS = {
        "heating-gas": "Heating — Gas",
        "heating-electric": "Heating — Electric",
        "cooking-gas": "Cooking — Gas",
        "cooking-electric": "Cooking — Electric",
        "water-heating-gas": "Water Heating — Gas",
        "water-heating-electric": "Water Heating — Electric",
        "basic-electric": "Basic Electric",
        water: "Water",
      };

      const DEFAULT_TENANT_UTILITIES = [
        "heating-gas",
        "cooking-gas",
        "water-heating-gas",
        "water",
      ];

      const AMI_BANDS = [
        "<=30",
        "31-40",
        "41-50",
        "51-60",
        "61-70",
        "71-80",
        ">80",
      ];

      const AMI_BAND_LABELS = {
        "<=30": "≤30% AMI",
        "31-40": "31–40% AMI",
        "41-50": "41–50% AMI",
        "51-60": "51–60% AMI",
        "61-70": "61–70% AMI",
        "71-80": "71–80% AMI",
        ">80": ">80% AMI",
      };

      /* ============================================================
       * AMI data — LA County 2025 (from ami-data/los-angeles-2025.ts)
       * ============================================================ */
      const INCOME_80 = {
        Studio: 84850,
        "1 Bedroom": 96950,
        "2 Bedroom": 109050,
        "3 Bedroom": 121150,
        "4 Bedroom": 130850,
        "5 Bedroom": 140550,
      };
      const AMI_BAND_PCTS = [30, 40, 50, 60, 70, 80];
      const incomeAt80 = (unitType) => INCOME_80[unitType];
      const incomeAtBand = (unitType, bandPct) =>
        (INCOME_80[unitType] * bandPct) / 80;

      const UTILITY_ALLOWANCE = {
        "heating-gas": { Studio: 10, "1 Bedroom": 14, "2 Bedroom": 18, "3 Bedroom": 23, "4 Bedroom": 31, "5 Bedroom": 36 },
        "heating-electric": { Studio: 21, "1 Bedroom": 31, "2 Bedroom": 40, "3 Bedroom": 50, "4 Bedroom": 67, "5 Bedroom": 78 },
        "cooking-gas": { Studio: 6, "1 Bedroom": 8, "2 Bedroom": 10, "3 Bedroom": 13, "4 Bedroom": 16, "5 Bedroom": 18 },
        "cooking-electric": { Studio: 11, "1 Bedroom": 16, "2 Bedroom": 21, "3 Bedroom": 25, "4 Bedroom": 32, "5 Bedroom": 36 },
        "water-heating-gas": { Studio: 9, "1 Bedroom": 13, "2 Bedroom": 17, "3 Bedroom": 21, "4 Bedroom": 29, "5 Bedroom": 36 },
        "water-heating-electric": { Studio: 22, "1 Bedroom": 31, "2 Bedroom": 40, "3 Bedroom": 49, "4 Bedroom": 62, "5 Bedroom": 71 },
        "basic-electric": { Studio: 38, "1 Bedroom": 46, "2 Bedroom": 55, "3 Bedroom": 67, "4 Bedroom": 77, "5 Bedroom": 91 },
        water: { Studio: 84, "1 Bedroom": 92, "2 Bedroom": 100, "3 Bedroom": 116, "4 Bedroom": 132, "5 Bedroom": 148 },
      };

      const DATASET = {
        id: "los-angeles-2025",
        label: "Los Angeles County (2025)",
        bandPcts: AMI_BAND_PCTS,
        incomeAt80,
        incomeAtBand,
        utilityAllowance: UTILITY_ALLOWANCE,
      };

      /* ============================================================
       * Normalize (from src/lib/screener/normalize.ts)
       * ============================================================ */
      const ALIASES = {
        studio: "Studio", single: "Studio", sro: "Studio",
        "0": "Studio", "0br": "Studio", "0 br": "Studio", "0 bedroom": "Studio", "0bed": "Studio",
        "1": "1 Bedroom", "1br": "1 Bedroom", "1 br": "1 Bedroom", "1bd": "1 Bedroom", "1 bd": "1 Bedroom", "1bdr": "1 Bedroom", "1 bdr": "1 Bedroom", "1bed": "1 Bedroom", "1 bed": "1 Bedroom", "1 bedroom": "1 Bedroom", "one bedroom": "1 Bedroom",
        "2": "2 Bedroom", "2br": "2 Bedroom", "2 br": "2 Bedroom", "2bd": "2 Bedroom", "2 bd": "2 Bedroom", "2bdr": "2 Bedroom", "2 bdr": "2 Bedroom", "2bed": "2 Bedroom", "2 bed": "2 Bedroom", "2 bedroom": "2 Bedroom", "two bedroom": "2 Bedroom",
        "3": "3 Bedroom", "3br": "3 Bedroom", "3 br": "3 Bedroom", "3bd": "3 Bedroom", "3 bd": "3 Bedroom", "3bdr": "3 Bedroom", "3 bdr": "3 Bedroom", "3bed": "3 Bedroom", "3 bed": "3 Bedroom", "3 bedroom": "3 Bedroom", "three bedroom": "3 Bedroom",
        "4": "4 Bedroom", "4br": "4 Bedroom", "4 br": "4 Bedroom", "4bd": "4 Bedroom", "4 bd": "4 Bedroom", "4bdr": "4 Bedroom", "4 bdr": "4 Bedroom", "4bed": "4 Bedroom", "4 bed": "4 Bedroom", "4 bedroom": "4 Bedroom", "four bedroom": "4 Bedroom",
        "5": "5 Bedroom", "5br": "5 Bedroom", "5 br": "5 Bedroom", "5bd": "5 Bedroom", "5 bd": "5 Bedroom", "5bdr": "5 Bedroom", "5 bdr": "5 Bedroom", "5bed": "5 Bedroom", "5 bed": "5 Bedroom", "5 bedroom": "5 Bedroom", "five bedroom": "5 Bedroom",
      };

      function normalizeUnitType(raw) {
        if (!raw) return null;
        const cleaned = raw.toString().trim().toLowerCase().replace(/\./g, "").replace(/s$/, "");
        if (UNIT_TYPES.includes(raw)) return raw;
        if (ALIASES[cleaned]) return ALIASES[cleaned];
        const m = cleaned.match(/^(\d)\b/);
        if (m && ALIASES[m[1]]) return ALIASES[m[1]];
        return null;
      }

      function parseRent(raw) {
        if (raw == null || raw === "") return null;
        if (typeof raw === "number") return Number.isFinite(raw) && raw >= 0 ? raw : null;
        const cleaned = raw.toString().replace(/[$,\s]/g, "");
        if (!cleaned) return null;
        const n = Number(cleaned);
        return Number.isFinite(n) && n >= 0 ? n : null;
      }

      /* ============================================================
       * CAMR affordability logic (from src/lib/screener/camr.ts)
       * ============================================================ */
      function utilityAllowanceFor(unitType, utilities, dataset) {
        if (!utilities.tenantPays) return 0;
        return utilities.lineItems.reduce(
          (sum, item) => sum + ((dataset.utilityAllowance[item] || {})[unitType] || 0),
          0
        );
      }

      function computeBedroomLimits(utilities, dataset = DATASET) {
        const out = {};
        for (const unitType of UNIT_TYPES) {
          const income80 = dataset.incomeAt80(unitType);
          const baseLimit = (income80 * 0.3) / 12;
          const ua = utilityAllowanceFor(unitType, utilities, dataset);
          const maxRent = baseLimit - ua;
          const bandCeilings = dataset.bandPcts.map((pct) => {
            const income = dataset.incomeAtBand(unitType, pct);
            const ceiling = (income * 0.3) / 12 - ua;
            const band =
              pct === 30 ? "<=30"
              : pct === 40 ? "31-40"
              : pct === 50 ? "41-50"
              : pct === 60 ? "51-60"
              : pct === 70 ? "61-70"
              : "71-80";
            return { band, ceiling };
          });
          out[unitType] = { unitType, income80, baseLimit, utilityAllowance: ua, maxRent, bandCeilings };
        }
        return out;
      }

      function assignBand(rent, limits) {
        if (rent == null || !limits) return ">80";
        for (const { band, ceiling } of limits.bandCeilings) {
          if (rent <= ceiling) return band;
        }
        return ">80";
      }

      function evaluateRentRoll(units, utilities, dataset = DATASET) {
        const bedroomLimits = computeBedroomLimits(utilities, dataset);
        const bandBreakdown = {};
        for (const ut of UNIT_TYPES) {
          bandBreakdown[ut] = AMI_BANDS.reduce((acc, b) => ((acc[b] = 0), acc), {});
        }
        const failingByType = new Set();

        const evaluations = units.map((unit) => {
          if (!unit.unitType) {
            return { unit, qualifies: false, maxRent: null, band: ">80", reason: "Missing bedroom type" };
          }
          const limits = bedroomLimits[unit.unitType];
          const maxRent = limits.maxRent;
          if (unit.rent == null) {
            bandBreakdown[unit.unitType][">80"]++;
            failingByType.add(unit.unitType);
            return { unit, qualifies: false, maxRent, band: ">80", reason: "Vacant / no rent" };
          }
          const qualifies = unit.rent <= maxRent;
          const band = assignBand(unit.rent, limits);
          bandBreakdown[unit.unitType][band]++;
          if (!qualifies) failingByType.add(unit.unitType);
          return { unit, qualifies, maxRent, band };
        });

        const totalUnits = units.length;
        const nonQualifyingUnits = evaluations.filter((e) => !e.qualifies).length;
        const qualifyingUnits = totalUnits - nonQualifyingUnits;
        const qualificationRate = totalUnits === 0 ? 0 : qualifyingUnits / totalUnits;
        const qualifies = qualificationRate > 0.66;

        return {
          totalUnits, qualifyingUnits, nonQualifyingUnits, qualificationRate, qualifies,
          bedroomLimits, evaluations, bandBreakdown,
          failingBedroomTypes: Array.from(failingByType),
        };
      }

      /* ============================================================
       * Server-function equivalents — client-side fetches.
       * Both endpoints (Nominatim + ArcGIS) allow cross-origin requests,
       * so this works from a static host like GitHub Pages.
       * ============================================================ */
      async function geocodeFreeText(address) {
        try {
          const url = new URL("https://nominatim.openstreetmap.org/search");
          url.searchParams.set("q", address);
          url.searchParams.set("format", "json");
          url.searchParams.set("addressdetails", "1");
          url.searchParams.set("countrycodes", "us");
          url.searchParams.set("limit", "5");
          // California viewbox (lon_min,lat_max,lon_max,lat_min)
          url.searchParams.set("viewbox", "-124.48,42.01,-114.13,32.53");
          url.searchParams.set("bounded", "1");
          const res = await fetch(url.toString(), { headers: { Accept: "application/json" } });
          if (!res.ok) return { state: "unknown", reason: `Geocoder HTTP ${res.status}` };
          const json = await res.json();
          if (!json.length) return { state: "unknown", reason: "No matching address found" };
          const caMatch = json.find(
            (m) => (m.address && m.address.state === "California") || /California/.test(m.display_name || "")
          );
          if (!caMatch) return { state: "unknown", reason: "Address found but not in California" };
          return {
            state: "found",
            lat: parseFloat(caMatch.lat),
            lon: parseFloat(caMatch.lon),
            matchedAddress: caMatch.display_name,
          };
        } catch (e) {
          return { state: "unknown", reason: "Geocoder error" };
        }
      }

      async function lookupDac(lat, lon) {
        const base =
          "https://services1.arcgis.com/PCHfdHz4GlDNAhBb/arcgis/rest/services/CalEnviroScreen_4_0_Results_/FeatureServer/0/query";
        const params = new URLSearchParams({
          geometry: `${lon},${lat}`,
          geometryType: "esriGeometryPoint",
          inSR: "4326",
          spatialRel: "esriSpatialRelIntersects",
          outFields: "CIscore,CIscoreP", // CIscoreP = statewide percentile, CIscore = raw score
          returnGeometry: "false",
          f: "json",
        });
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 8000);
        try {
          const res = await fetch(`${base}?${params.toString()}`, {
            signal: controller.signal,
            headers: { Accept: "application/json" },
          });
          if (!res.ok) return { state: "unknown", reason: `CalEnviroScreen HTTP ${res.status}` };
          const json = await res.json();
          if (json.error) return { state: "unknown", reason: json.error.message || "ArcGIS error" };
          const feature = (json.features || [])[0];
          const pct = feature && feature.attributes ? feature.attributes.CIscoreP : null;
          if (pct == null) return { state: "unknown", reason: "No CalEnviroScreen tract for this location" };
          return {
            state: "found",
            pct,
            isDAC: Math.round(pct) >= 75,
            ces4Score: (feature.attributes.CIscore != null) ? feature.attributes.CIscore : null,
          };
        } catch (err) {
          return {
            state: "unknown",
            reason: err && err.name === "AbortError" ? "CalEnviroScreen lookup timed out" : "CalEnviroScreen lookup error",
          };
        } finally {
          clearTimeout(timer);
        }
      }

      /* ============================================================
       * Tiny inline icons (replacing lucide-react)
       * ============================================================ */
      const Icon = ({ d, className, fill }) => (
        <svg viewBox="0 0 24 24" fill={fill || "none"} stroke="currentColor"
          strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
          className={className} aria-hidden="true">
          {d}
        </svg>
      );
      const CheckCircle = ({ className }) => (
        <Icon className={className} d={<><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" /><path d="m9 11 3 3L22 4" /></>} />
      );
      const XCircle = ({ className }) => (
        <Icon className={className} d={<><circle cx="12" cy="12" r="10" /><path d="m15 9-6 6" /><path d="m9 9 6 6" /></>} />
      );
      const HelpCircle = ({ className }) => (
        <Icon className={className} d={<><circle cx="12" cy="12" r="10" /><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" /><path d="M12 17h.01" /></>} />
      );
      const Spinner = ({ className }) => (
        <svg viewBox="0 0 24 24" fill="none" className={className + " animate-spin"} aria-hidden="true">
          <circle cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="3" opacity="0.25" />
          <path d="M12 2a10 10 0 0 1 10 10" stroke="currentColor" strokeWidth="3" strokeLinecap="round" />
        </svg>
      );

      /* ============================================================
       * Retrofit.LA brand lockup
       * ============================================================ */
      function RetrofitStripes({ className }) {
        return (
          <svg viewBox="0 0 60 72" className={className} fill="none" aria-hidden="true">
            {[0, 22, 44].map((y) => (
              <path key={y} d={`M14 ${y} h18 l-14 24 h-18 z`} fill="#A2E543" />
            ))}
          </svg>
        );
      }
      function RetrofitWordmark({ onDark, className }) {
        return (
          <span className={"font-black tracking-tight " + (className || "")}>
            <span className={onDark ? "text-white" : "text-retrofit-blue"}>Retrofit</span>
            <span className="text-retrofit-green">.LA</span>
          </span>
        );
      }

      /* ============================================================
       * Shared UI primitives
       * ============================================================ */
      const inputCls =
        "flex h-10 w-full rounded-md border border-slate-200 bg-white px-3 py-2 text-sm placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-retrofit-blue/60";
      const Card = ({ children, className }) => (
        <div className={"rounded-lg border border-slate-200 bg-white shadow-sm " + (className || "")}>
          {children}
        </div>
      );
      const Section = ({ title, children }) => (
        <Card>
          <div className="p-6">
            <h2 className="text-base font-bold text-retrofit-blue">{title}</h2>
            <div className="mt-4">{children}</div>
          </div>
        </Card>
      );
      const Badge = ({ children, kind }) => {
        const styles = {
          pass: "bg-retrofit-green text-retrofit-dark",
          secondary: "bg-slate-100 text-slate-700",
          outline: "border border-slate-300 text-slate-600",
          destructive: "bg-red-600 text-white",
        };
        return (
          <span className={"inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-bold " + styles[kind]}>
            {children}
          </span>
        );
      };
      const currency = (n) =>
        n.toLocaleString("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 });

      /* ============================================================
       * Address input with Nominatim autocomplete
       * ============================================================ */
      function AddressInput({ value, onChange }) {
        const [query, setQuery] = useState(value.display);
        const [suggestions, setSuggestions] = useState([]);
        const [open, setOpen] = useState(false);
        const [loading, setLoading] = useState(false);
        const abortRef = useRef(null);
        const debounceRef = useRef(null);

        useEffect(() => setQuery(value.display), [value.display]);

        useEffect(() => {
          if (!query || query.length < 4) { setSuggestions([]); return; }
          if (debounceRef.current) clearTimeout(debounceRef.current);
          debounceRef.current = setTimeout(async () => {
            if (abortRef.current) abortRef.current.abort();
            const controller = new AbortController();
            abortRef.current = controller;
            setLoading(true);
            try {
              const url = new URL("https://nominatim.openstreetmap.org/search");
              url.searchParams.set("q", query);
              url.searchParams.set("format", "json");
              url.searchParams.set("addressdetails", "0");
              url.searchParams.set("countrycodes", "us");
              url.searchParams.set("limit", "5");
              url.searchParams.set("viewbox", "-124.48,42.01,-114.13,32.53");
              url.searchParams.set("bounded", "1");
              const res = await fetch(url.toString(), { signal: controller.signal, headers: { Accept: "application/json" } });
              if (!res.ok) { setSuggestions([]); return; }
              setSuggestions(await res.json());
            } catch (e) {
              /* ignore (likely aborted) */
            } finally {
              setLoading(false);
            }
          }, 400);
          return () => { if (debounceRef.current) clearTimeout(debounceRef.current); };
        }, [query]);

        return (
          <div className="space-y-2">
            <label htmlFor="address" className="text-sm font-medium">Property address</label>
            <div className="relative">
              <input
                id="address"
                className={inputCls}
                placeholder="123 Main St, Los Angeles, CA"
                value={query}
                autoComplete="off"
                onFocus={() => setOpen(true)}
                onBlur={() => setTimeout(() => setOpen(false), 150)}
                onChange={(e) => {
                  setQuery(e.target.value);
                  setOpen(true);
                  onChange({ display: e.target.value, hasCoords: false });
                }}
              />
              {open && (suggestions.length > 0 || loading) && (
                <div className="absolute z-20 mt-1 w-full overflow-hidden rounded-md border border-slate-200 bg-white shadow-md">
                  {loading && <div className="px-3 py-2 text-sm text-slate-500">Searching…</div>}
                  {suggestions.map((s) => (
                    <button
                      key={s.place_id}
                      type="button"
                      className="block w-full cursor-pointer truncate px-3 py-2 text-left text-sm hover:bg-slate-50"
                      onMouseDown={(e) => {
                        e.preventDefault();
                        setQuery(s.display_name);
                        setOpen(false);
                        setSuggestions([]);
                        onChange({ display: s.display_name, lat: parseFloat(s.lat), lon: parseFloat(s.lon), hasCoords: true });
                      }}
                    >
                      {s.display_name}
                    </button>
                  ))}
                </div>
              )}
            </div>
            <p className="text-xs text-slate-500">
              Pick a suggestion for the fastest result, or just type a California address and we'll geocode it.
            </p>
          </div>
        );
      }

      /* ============================================================
       * Rent roll table
       * ============================================================ */
      const newId = () => Math.random().toString(36).slice(2);
      const newUnit = () => ({ id: newId(), label: "", unitType: null, rent: null });
      const makeEmptyRentRoll = (n = 3) => Array.from({ length: n }, newUnit);

      function RentRollTable({ units, onChange }) {
        const update = (id, patch) => onChange(units.map((u) => (u.id === id ? { ...u, ...patch } : u)));
        const remove = (id) => onChange(units.filter((u) => u.id !== id));
        const add = () => onChange([...units, newUnit()]);

        return (
          <div className="space-y-3">
            <div className="overflow-x-auto rounded-md border border-slate-200">
              <table className="w-full text-sm">
                <thead className="bg-slate-50">
                  <tr className="text-left">
                    <th className="px-3 py-2 font-medium">Unit #</th>
                    <th className="px-3 py-2 font-medium">Bedroom type</th>
                    <th className="px-3 py-2 font-medium">Monthly rent</th>
                    <th className="w-12"></th>
                  </tr>
                </thead>
                <tbody>
                  {units.map((u) => (
                    <tr key={u.id} className="border-t border-slate-200">
                      <td className="px-3 py-2">
                        <input className={inputCls + " h-9"} placeholder="optional"
                          value={u.label || ""} onChange={(e) => update(u.id, { label: e.target.value })} />
                      </td>
                      <td className="px-3 py-2">
                        <select className={inputCls + " h-9"} value={u.unitType || ""}
                          onChange={(e) => update(u.id, { unitType: e.target.value || null })}>
                          <option value="">Select…</option>
                          {UNIT_TYPES.map((t) => <option key={t} value={t}>{t}</option>)}
                        </select>
                      </td>
                      <td className="px-3 py-2">
                        <input className={inputCls + " h-9"} inputMode="decimal" placeholder="$"
                          value={u.rent == null ? "" : String(u.rent)}
                          onChange={(e) => update(u.id, { rent: parseRent(e.target.value) })} />
                      </td>
                      <td className="px-3 py-2">
                        <button onClick={() => remove(u.id)} aria-label="Remove unit"
                          className="inline-flex h-9 w-9 items-center justify-center rounded-md text-slate-500 hover:bg-slate-100">
                          <Icon className="h-4 w-4" d={<><path d="M3 6h18" /><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /></>} />
                        </button>
                      </td>
                    </tr>
                  ))}
                  {units.length === 0 && (
                    <tr><td colSpan="4" className="px-3 py-6 text-center text-sm text-slate-500">No units yet. Add one to get started.</td></tr>
                  )}
                </tbody>
              </table>
            </div>
            <button onClick={add}
              className="inline-flex items-center gap-1 rounded-md border border-slate-300 bg-white px-3 h-9 text-sm font-medium hover:bg-slate-50">
              <Icon className="h-4 w-4" d={<><path d="M5 12h14" /><path d="M12 5v14" /></>} /> Add unit
            </button>
          </div>
        );
      }

      /* ============================================================
       * CSV import (PapaParse)
       * ============================================================ */
      function pickColumn(row, candidates) {
        const keys = Object.keys(row);
        for (const c of candidates) {
          const k = keys.find((x) => x.trim().toLowerCase() === c);
          if (k) return String(row[k] == null ? "" : row[k]);
        }
        return null;
      }
      function CsvImport({ onImport }) {
        const inputRef = useRef(null);
        const [error, setError] = useState(null);
        const [summary, setSummary] = useState(null);

        function handleFile(file) {
          setError(null); setSummary(null);
          Papa.parse(file, {
            header: true, skipEmptyLines: true,
            complete: (results) => {
              const rows = results.data || [];
              if (!rows.length) { setError("CSV is empty."); return; }
              const units = []; let skipped = 0;
              for (const row of rows) {
                const unitTypeRaw = pickColumn(row, ["unit type", "bedroom type", "bedrooms", "type"]);
                const rentRaw = pickColumn(row, ["rent", "monthly rent", "tenant rent"]);
                const label = pickColumn(row, ["unit", "unit #", "unit number", "unit no", "apt"]);
                const unitType = normalizeUnitType(unitTypeRaw);
                const rent = parseRent(rentRaw);
                if (!unitType && !rentRaw && !label) { skipped++; continue; }
                units.push({ id: newId(), label: label || "", unitType, rent });
              }
              if (!units.length) { setError("Couldn't find any rows. Expected headers like 'Unit Type' and 'Rent'."); return; }
              const unknownCount = units.filter((u) => !u.unitType).length;
              setSummary(
                `Imported ${units.length} unit${units.length === 1 ? "" : "s"}` +
                (unknownCount ? ` (${unknownCount} need a bedroom type — fix below)` : "") +
                (skipped ? `; skipped ${skipped} empty row${skipped === 1 ? "" : "s"}` : "") + "."
              );
              onImport(units);
            },
            error: (err) => setError(err.message),
          });
        }

        return (
          <div className="rounded-md border border-dashed border-slate-300 p-6 text-center">
            <input ref={inputRef} type="file" accept=".csv,text/csv" className="hidden"
              onChange={(e) => { const f = e.target.files[0]; if (f) handleFile(f); if (inputRef.current) inputRef.current.value = ""; }} />
            <Icon className="mx-auto h-6 w-6 text-slate-400" d={<><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><path d="M17 8l-5-5-5 5" /><path d="M12 3v12" /></>} />
            <p className="mt-2 text-sm text-slate-500">
              Upload a CSV with <span className="font-medium">Unit Type</span> and <span className="font-medium">Rent</span> columns. We'll populate the table below for review.
            </p>
            <button onClick={() => inputRef.current && inputRef.current.click()}
              className="mt-3 inline-flex items-center rounded-md border border-slate-300 bg-white px-3 h-9 text-sm font-medium hover:bg-slate-50">
              Choose CSV
            </button>
            {summary && <p className="mt-3 text-sm text-retrofit-dark">{summary}</p>}
            {error && <p className="mt-3 text-sm text-red-600">{error}</p>}
          </div>
        );
      }

      /* ============================================================
       * Utilities config
       * ============================================================ */
      function UtilityConfigForm({ value, onChange }) {
        const toggle = (item, checked) => {
          const next = checked
            ? Array.from(new Set([...value.lineItems, item]))
            : value.lineItems.filter((i) => i !== item);
          onChange({ ...value, lineItems: next });
        };
        return (
          <div className="space-y-4">
            <div className="space-y-2">
              <p className="text-sm font-medium">Does the tenant pay any utilities?</p>
              <div className="flex gap-6">
                {[["yes", true], ["no", false]].map(([k, v]) => (
                  <label key={k} className="flex items-center gap-2 text-sm">
                    <input type="radio" name="tenantPays" className="h-4 w-4 accent-retrofit-blue"
                      checked={value.tenantPays === v} onChange={() => onChange({ ...value, tenantPays: v })} />
                    {k === "yes" ? "Yes" : "No"}
                  </label>
                ))}
              </div>
            </div>
            {value.tenantPays && (
              <div className="space-y-2 rounded-md border border-slate-200 p-4">
                <p className="text-sm font-medium">Which utilities does the tenant pay?</p>
                <div className="grid grid-cols-1 gap-2 pt-1 sm:grid-cols-2">
                  {UTILITY_LINE_ITEMS.map((item) => (
                    <label key={item} className="flex items-center gap-2 text-sm">
                      <input type="checkbox" className="h-4 w-4 accent-retrofit-blue"
                        checked={value.lineItems.includes(item)}
                        onChange={(e) => toggle(item, e.target.checked)} />
                      {UTILITY_LABELS[item]}
                    </label>
                  ))}
                </div>
                <p className="pt-1 text-xs text-slate-500">
                  Default: tenant pays gas heat, gas cooking, gas water heat, and water.
                </p>
              </div>
            )}
          </div>
        );
      }

      /* ============================================================
       * Results panel
       * ============================================================ */
      function DacResultCard({ result, geocodedAddress }) {
        return (
          <Card>
            <div className="p-6">
              <div className="flex items-center justify-between">
                <h3 className="text-base font-bold text-retrofit-blue">Disadvantaged Community (CalEPA)</h3>
                {result && result.state === "found" && (result.isDAC ? <Badge kind="pass">DAC</Badge> : <Badge kind="secondary">Not a DAC</Badge>)}
                {result && result.state === "unknown" && <Badge kind="outline">Unknown</Badge>}
              </div>
              <div className="mt-4 space-y-3 text-sm">
                {geocodedAddress && <p className="text-xs text-slate-500">Geocoded: {geocodedAddress}</p>}
                {!result && <p className="text-slate-500">No result yet.</p>}
                {result && result.state === "found" && (
                  <>
                    <div className="flex items-center gap-2">
                      {result.isDAC
                        ? <CheckCircle className="h-5 w-5 text-retrofit-blue" />
                        : <XCircle className="h-5 w-5 text-slate-400" />}
                      <p>CalEnviroScreen 4.0 percentile: <span className="font-semibold">{result.pct.toFixed(1)}</span></p>
                    </div>
                    <p className="text-xs text-slate-500">
                      CalEPA defines a DAC as the top 25% statewide on CalEnviroScreen (percentile ≥ 75). This property{" "}
                      <span className="font-medium">{result.isDAC ? "qualifies as a DAC" : "is not a DAC"}</span>.
                    </p>
                  </>
                )}
                {result && result.state === "unknown" && (
                  <div className="flex items-start gap-2">
                    <HelpCircle className="mt-0.5 h-5 w-5 text-slate-400" />
                    <p className="text-slate-500">We couldn't determine DAC status: {result.reason}. Treat as neither DAC nor non-DAC and verify manually.</p>
                  </div>
                )}
              </div>
            </div>
          </Card>
        );
      }

      function CamrResultCard({ result }) {
        if (!result) {
          return (
            <Card><div className="p-6">
              <h3 className="text-base font-bold text-retrofit-blue">Affordability (80% AMI test)</h3>
              <p className="mt-4 text-sm text-slate-500">No result yet.</p>
            </div></Card>
          );
        }
        const pct = (result.qualificationRate * 100).toFixed(1);
        const presentBedrooms = UNIT_TYPES.filter((ut) => result.evaluations.some((e) => e.unit.unitType === ut));
        return (
          <Card><div className="p-6">
            <div className="flex items-center justify-between">
              <h3 className="text-base font-bold text-retrofit-blue">Affordability (80% AMI test)</h3>
              {result.qualifies ? <Badge kind="pass">Qualifies</Badge> : <Badge kind="destructive">Does not qualify</Badge>}
            </div>
            <div className="mt-4 space-y-4 text-sm">
              <div className="flex items-start gap-2">
                {result.qualifies ? <CheckCircle className="mt-0.5 h-5 w-5 text-retrofit-blue" /> : <XCircle className="mt-0.5 h-5 w-5 text-red-600" />}
                <div>
                  <p><span className="font-semibold">{result.qualifyingUnits}</span> of <span className="font-semibold">{result.totalUnits}</span> units (<span className="font-semibold">{pct}%</span>) rent at or below the 80% AMI affordability limit.</p>
                  <p className="text-xs text-slate-500">CAMR baseline requires more than 66% of units to qualify.</p>
                  {!result.qualifies && result.failingBedroomTypes.length > 0 && (
                    <p className="mt-1 text-xs text-red-600">Driven by: {result.failingBedroomTypes.join(", ")}.</p>
                  )}
                </div>
              </div>

              {presentBedrooms.length > 0 && (
                <div>
                  <p className="mb-2 font-medium">Max qualifying rent by bedroom</p>
                  <div className="overflow-x-auto rounded-md border border-slate-200">
                    <table className="w-full text-sm">
                      <thead><tr className="border-b border-slate-200 text-slate-500">
                        <th className="px-3 py-2 text-left font-medium">Bedroom</th>
                        <th className="px-3 py-2 text-right font-medium">Base limit</th>
                        <th className="px-3 py-2 text-right font-medium">Utility allowance</th>
                        <th className="px-3 py-2 text-right font-medium">Max rent</th>
                      </tr></thead>
                      <tbody>
                        {presentBedrooms.map((ut) => {
                          const l = result.bedroomLimits[ut];
                          return (
                            <tr key={ut} className="border-b border-slate-200 last:border-0">
                              <td className="px-3 py-2">{ut}</td>
                              <td className="px-3 py-2 text-right">{currency(l.baseLimit)}</td>
                              <td className="px-3 py-2 text-right">{l.utilityAllowance > 0 ? "− " + currency(l.utilityAllowance) : "—"}</td>
                              <td className="px-3 py-2 text-right font-semibold">{currency(l.maxRent)}</td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {presentBedrooms.length > 0 && (
                <div>
                  <p className="mb-2 font-medium">AMI band breakdown</p>
                  <div className="overflow-x-auto rounded-md border border-slate-200">
                    <table className="w-full text-sm">
                      <thead><tr className="border-b border-slate-200 text-slate-500">
                        <th className="px-3 py-2 text-left font-medium">Bedroom</th>
                        {AMI_BANDS.map((b) => <th key={b} className="px-3 py-2 text-right font-medium">{AMI_BAND_LABELS[b]}</th>)}
                      </tr></thead>
                      <tbody>
                        {presentBedrooms.map((ut) => (
                          <tr key={ut} className="border-b border-slate-200 last:border-0">
                            <td className="px-3 py-2">{ut}</td>
                            {AMI_BANDS.map((b) => {
                              const n = result.bandBreakdown[ut][b];
                              return <td key={b} className={"px-3 py-2 text-right " + (b === ">80" && n > 0 ? "text-red-600" : "")}>{n || "—"}</td>;
                            })}
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                  <p className="mt-2 text-xs text-slate-500">
                    Units fall into the lowest band whose rent ceiling they meet. The {">80% AMI"} column equals the non-qualifying count.
                  </p>
                </div>
              )}
            </div>
          </div></Card>
        );
      }

      /* ============================================================
       * App
       * ============================================================ */
      function App() {
        const [address, setAddress] = useState({ display: "", hasCoords: false });
        const [units, setUnits] = useState(() => makeEmptyRentRoll(3));
        const [utilities, setUtilities] = useState({ tenantPays: true, lineItems: DEFAULT_TENANT_UTILITIES });
        const [tab, setTab] = useState("manual");
        const [running, setRunning] = useState(false);
        const [dac, setDac] = useState(null);
        const [camr, setCamr] = useState(null);
        const [geocodedLabel, setGeocodedLabel] = useState(null);
        const [error, setError] = useState(null);

        const eligibleUnits = units.filter((u) => u.unitType !== null);
        const canRun = address.display.trim().length > 0 && eligibleUnits.length > 0;

        async function runScreening() {
          setError(null); setRunning(true); setDac(null); setCamr(null); setGeocodedLabel(null);
          try {
            setCamr(evaluateRentRoll(eligibleUnits, utilities));
            let lat = address.lat, lon = address.lon;
            let label = address.hasCoords ? address.display : null;
            if (lat == null || lon == null) {
              const geo = await geocodeFreeText(address.display);
              if (geo.state === "found") { lat = geo.lat; lon = geo.lon; label = geo.matchedAddress; }
              else { setDac({ state: "unknown", reason: geo.reason }); return; }
            }
            setGeocodedLabel(label);
            setDac(await lookupDac(lat, lon));
          } catch (e) {
            setError(e instanceof Error ? e.message : "Something went wrong.");
          } finally {
            setRunning(false);
          }
        }

        const tabBtn = (id, text) =>
          <button onClick={() => setTab(id)}
            className={"rounded-sm px-3 py-1.5 text-sm font-medium " + (tab === id ? "bg-white text-retrofit-dark shadow-sm" : "text-slate-500")}>
            {text}
          </button>;

        return (
          <div className="min-h-screen bg-white">
            <header className="bg-retrofit-blue">
              <div className="mx-auto flex max-w-5xl items-start gap-5 px-6 py-9">
                <RetrofitStripes className="mt-1 hidden h-16 w-12 shrink-0 sm:block" />
                <div>
                  <RetrofitWordmark onDark className="text-2xl" />
                  <h1 className="mt-3 text-3xl font-extrabold tracking-tight text-white">Affordable Property Screener</h1>
                  <p className="mt-2 max-w-2xl text-sm text-white/75">
                    Check whether a California property sits in a CalEPA Disadvantaged Community and whether its rent roll meets the 80% AMI affordability threshold used as the baseline for most low-income multifamily incentive programs.
                  </p>
                </div>
              </div>
              <div className="h-1.5 w-full bg-retrofit-green"></div>
            </header>

            <main className="mx-auto max-w-5xl space-y-6 px-6 py-8">
              <Section title="1. Property address">
                <AddressInput value={address} onChange={setAddress} />
              </Section>

              <Section title="2. Rent roll">
                <div className="inline-flex h-10 items-center rounded-md bg-slate-100 p-1">
                  {tabBtn("manual", "Manual entry")}
                  {tabBtn("csv", "CSV upload")}
                </div>
                <div className="pt-4">
                  {tab === "csv" && <div className="pb-4"><CsvImport onImport={setUnits} /></div>}
                  <RentRollTable units={units} onChange={setUnits} />
                </div>
              </Section>

              <Section title="3. Utilities">
                <UtilityConfigForm value={utilities} onChange={setUtilities} />
              </Section>

              <div className="flex flex-wrap items-center gap-3">
                <button onClick={runScreening} disabled={!canRun || running}
                  className="inline-flex items-center justify-center rounded-md bg-retrofit-blue px-8 h-11 text-sm font-bold text-white hover:bg-retrofit-blue/90 disabled:opacity-50">
                  {running && <Spinner className="mr-2 h-4 w-4" />}
                  Run screening
                </button>
                {!canRun && <p className="text-xs text-slate-500">Enter an address and at least one unit with a bedroom type.</p>}
                {error && <p className="text-sm text-red-600">{error}</p>}
              </div>

              {(dac || camr || running) && (
                <div className="grid gap-4 md:grid-cols-2">
                  <DacResultCard result={dac} geocodedAddress={geocodedLabel} />
                  <CamrResultCard result={camr} />
                </div>
              )}

              <footer className="pt-8 text-xs text-slate-500">
                DAC determination uses CalEnviroScreen 4.0 (top 25% statewide ≥ 75th percentile). Affordability uses LA County 2025 AMI + utility allowance tables as a general baseline; verify against the program-specific guidance for your county before relying on these results.
              </footer>
            </main>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>

    <!-- Transform the JSX above with the classic runtime, then run it. -->
    <script>
      (function () {
        var src = document.getElementById("appcode").textContent;
        var out = Babel.transform(src, {
          presets: [["react", { runtime: "classic" }]],
        }).code;
        (0, eval)(out);
      })();
    </script>
  </body>
